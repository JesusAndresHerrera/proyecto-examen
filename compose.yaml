services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
